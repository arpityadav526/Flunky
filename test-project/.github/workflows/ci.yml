name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/check.py
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --extra dev && uv run pytest && uv run ruff check .
        working-directory: .
