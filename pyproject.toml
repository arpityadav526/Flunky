[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "flunky"
version = "0.1.0"
description = "Developer tasks and project scaffolding from your terminal"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
  "typer>=0.27,<0.28",
  "rich>=14,<15",
  "questionary>=2.1,<3",
  "jinja2>=3.1.6,<4",
  "httpx>=0.28,<1",
  "pydantic>=2.12,<3",
  "platformdirs>=4,<5",
  "fastapi>=0.128,<1",
  "uvicorn>=0.40,<1",
  "sqlalchemy[asyncio]>=2.0.45,<2.1",
  "python-dotenv>=1,<2",
  "python-multipart>=0.0.22",
  "email-validator>=2,<3",
  "aiosqlite>=0.20",
  "asyncpg>=0.30",
  "alembic>=1.14",
  "pydantic-settings>=2.8",
  "structlog>=25",
  "gunicorn>=23 ; sys_platform != 'win32'",
  "sentry-sdk[fastapi]>=2",
  "uvicorn-worker>=0.3 ; sys_platform != 'win32'",
  "pwdlib[argon2,bcrypt]>=0.3,<1",
  "pyjwt>=2.10,<3",
  "keyring>=25,<27",
  "textual>=1,<9",
  "dateparser>=1.2,<2",
  "orjson>=3.10,<4",
  "packaging>=25",
]

[project.optional-dependencies]
test = [
    "pytest>=9.0.3,<10",
    "pytest-cov>=6",
    "pytest-asyncio>=1",
    "pytest-xdist>=3",
    "respx>=0.22",
    "syrupy>=5,<6",
    "hypothesis>=6",
]
dev = [
    "ruff>=0.15",
    "mypy>=1.15",
    "pre-commit>=4",
    "build>=1",
    "pip-audit>=2",
    "vulture>=2",
    "types-dateparser>=1.4.3.20260907",
]
docs = [
    "mkdocs-material>=9,<10",
]
release = [
    "cyclonedx-bom>=7,<8",
    "pyinstaller>=6,<7",
]

[project.scripts]
flunky = "cli.entry:main"

[tool.vercel]
entrypoint = "backend.main:app"

[tool.hatch.build.targets.wheel]
packages = ["cli", "backend"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
asyncio_mode = "auto"

[tool.coverage.run]
source = ["cli", "backend"]
concurrency = ["thread", "greenlet"]
omit = ["cli/templates/*"]

[tool.coverage.report]
show_missing = true
fail_under = 90

[tool.mypy]
python_version = "3.10"
strict = true
files = ["cli", "backend"]

[[tool.mypy.overrides]]
module = ["cli.main", "cli.services.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false
check_untyped_defs = false
warn_return_any = false
