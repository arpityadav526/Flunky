name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.10', '3.11', '3.12', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
      - run: uv sync --locked --extra dev --extra test
      - run: uv run ruff check cli backend tests
      - run: uv run ruff format --check cli backend tests
      - run: uv run mypy
      - run: uv run python -m pytest --cov=cli --cov=backend --cov-report=xml --cov-fail-under=90
      - run: uv build
      - run: uv venv --seed .install-check
      - shell: bash
        run: |
          if [ "$RUNNER_OS" = Windows ]; then
            PY=.install-check/Scripts/python.exe
            CLI=.install-check/Scripts/flunky.exe
          else
            PY=.install-check/bin/python
            CLI=.install-check/bin/flunky
          fi
          "$PY" -m pip install .
          "$CLI" --help
          "$CLI" --version
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t flunky:ci .

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.13'
      - run: uv sync --locked --extra dev
      - run: uv run pip-audit --skip-editable
