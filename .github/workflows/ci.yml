name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.10', '3.11', '3.12', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
      - run: uv sync --locked --extra dev --extra test
      - run: uv run ruff check cli backend tests scripts packaging
      - run: uv run ruff format --check cli backend tests scripts packaging
      - run: uv run mypy
      - run: uv run python -m pytest --cov=cli --cov=backend --cov-report=xml --cov-fail-under=90
      - run: uv build
      - run: uv venv --seed .install-check
      - shell: bash
        run: |
          if [ "$RUNNER_OS" = Windows ]; then
            PY=.install-check/Scripts/python.exe
            CLI=.install-check/Scripts/flunky.exe
          else
            PY=.install-check/bin/python
            CLI=.install-check/bin/flunky
          fi
          "$PY" -m pip install dist/*.whl
          "$CLI" --help
          "$CLI" --version
          "$PY" scripts/check_startup.py
          "$PY" -m scripts.verify_cli_surface --cli "$CLI"
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python scripts/setup_container.py
      - run: docker compose --env-file .env.docker up -d --build --wait --wait-timeout 180
      - run: docker compose --env-file .env.docker exec -T api python < scripts/smoke_api.py
      - run: docker compose --env-file .env.docker run --rm cli --version
      - if: always()
        run: docker compose --env-file .env.docker logs --tail=100
      - if: always()
        run: docker compose --env-file .env.docker down -v
  kubernetes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: helm/kind-action@v1
        with:
          cluster_name: flunky-ci
      - run: docker build -t flunky:local .
      - run: kind load docker-image flunky:local --name flunky-ci
      - run: python scripts/setup_container.py
      - run: kubectl apply -f deploy/kubernetes/namespace.yaml
      - run: kubectl -n flunky create secret generic flunky-secrets --from-env-file=.env.docker
      - run: kubectl apply -k deploy/kubernetes
      - run: kubectl -n flunky rollout status deployment/api --timeout=300s
      - run: kubectl -n flunky exec -i deployment/api -- python < scripts/smoke_api.py
      - if: failure()
        run: |
          kubectl -n flunky get pods,pvc
          kubectl -n flunky logs deployment/api --all-containers


  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.13'
      - run: uv sync --locked --extra dev
      - run: uv run pip-audit --skip-editable
  blueprints:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        stack: [python, cli, fastapi, ds, nextjs, mern, nestjs, electron, react-native, flutter]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: subosito/flutter-action@v2
        if: matrix.stack == 'flutter'
        with:
          channel: stable
      - run: uv sync --locked --extra dev --extra test
      - run: uv run python -m scripts.verify_blueprints --stack ${{ matrix.stack }}
      - run: uv run flunky init demo --stack ${{ matrix.stack }} --yes --install --directory .
      - run: python demo/scripts/check.py
      - if: contains(fromJSON('["python","cli","fastapi","ds"]'), matrix.stack)
        working-directory: demo
        run: uv run pytest && uv run ruff check .
      - if: contains(fromJSON('["nextjs","mern","nestjs","electron","react-native"]'), matrix.stack)
        working-directory: demo
        run: npm test && npm run lint && npm run build
      - if: matrix.stack == 'flutter'
        working-directory: demo
        run: flutter analyze && flutter test
