apiVersion: v1
kind: Service
metadata:
  name: api
spec:
  selector:
    app: flunky-api
  ports:
    - port: 8000
      targetPort: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
spec:
  # One process owns the in-memory limiter; Recreate also serializes migrations.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: flunky-api
  template:
    metadata:
      labels:
        app: flunky-api
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: wait-for-db
          image: postgres:16-alpine
          command: [sh, -c, 'until pg_isready -h db -U flunky -d flunky; do sleep 2; done']
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
      containers:
        - name: api
          image: flunky:local
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          env:
            - name: HOME
              value: /tmp
            - name: ENVIRONMENT
              value: production
            - name: MAIL_DELIVERY_ENABLED
              value: "false"
            - name: DATABASE_URL
              value: postgresql+asyncpg://flunky@db:5432/flunky
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: flunky-secrets
                  key: POSTGRES_PASSWORD
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: flunky-secrets
                  key: SECRET_KEY
          ports:
            - containerPort: 8000
          startupProbe:
            httpGet:
              path: /ready
              port: 8000
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /ready
              port: 8000
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 15
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
